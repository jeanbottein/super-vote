# Version updates, weekly, in one pull request: the server's Maven
# dependencies, the web app's npm packages, the workflows' actions and the
# images super-vote is built on and runs beside, majors included, so that its
# checks test them together and nothing drifts far behind. Each update waits
# a week after its release (cooldown): a compromised release is usually caught
# by then. Security updates are a repository setting, and come at once, each
# in its own pull request, cooldown or not (SECURITY.md).
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: maven
    directory: /servers/java
    multi-ecosystem-group: dependencies
    patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /clients/web
    multi-ecosystem-group: dependencies
    patterns: ['*']
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7, the native compiler, until typescript-eslint supports it:
      # its peer range ends below TypeScript 6.1, and npm ci refuses the pair.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ['*']
    cooldown:
      default-days: 7

  # The images the Dockerfiles build on, pinned by digest.
  - package-ecosystem: docker
    directories: [/servers/java, /clients/web]
    multi-ecosystem-group: dependencies
    patterns: ['*']
    cooldown:
      default-days: 7
    ignore:
      # Java and Node stay on the long-term releases .tool-versions names.
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # PostgreSQL, beside the server (deploy/compose.yaml).
  - package-ecosystem: docker-compose
    directory: /deploy
    multi-ecosystem-group: dependencies
    patterns: ['*']
    cooldown:
      default-days: 7
    ignore:
      # A new major version cannot open the files the previous one wrote: moving
      # to it is a dump and a restore, done by hand (deploy/README.md).
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
