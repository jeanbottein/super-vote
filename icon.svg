<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-32 -17 264 264" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Super Vote. A hexagonal ballot box whose bands are the mentions' colours, framed by an S whose
       spine is the median. Drawn upright, then turned 30 degrees. The whole icon has half-turn symmetry
       around (100,115): each band below the spine is drawn once and reused, turned 180 degrees, above it. -->
