      <stop offset="0" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
    <linearGradient id="frame" x2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a6678"/>
      <stop offset="1" stop-color="#3a4352"/>
    </linearGradient>
    <linearGradient id="frame-light" x2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcae96"/>
      <stop offset="1" stop-color="#a39680"/>
    </linearGradient>
