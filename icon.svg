<svg xmlns="http://www.w3.org/2000/svg" width="250" height="222" viewBox="-25 4 250 222">
  <!-- An S for super-vote across a hexagon: greens on one side of it, reds on the other, as on a
       majority judgment scale, lightest along its middle stroke, the median, darkest in the far
       corners. The S is bolder than the two sides it stands apart from. Drawn upright, then turned
       30 degrees. -->
