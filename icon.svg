      <stop offset="0.345" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="frame" x1="-0.5" y1="115" x2="200.5" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333333"/>
