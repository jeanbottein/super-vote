    <path id="inner" d="M 98.04,148 L 24.33,148.01 C 21.29,148.03 17.66,147.91 15.06,149.78 C 11.77,152.15 12.63,157.12 13.81,160.35 C 16,166.35 20.5,170.49 25.86,173.72 C 28.44,175.27 31.14,176.7 34.1,177.37 C 37.05,178.04 40.16,178 43.16,178 L 142.58,178 C 146.42,178 151.72,178.25 155.65,177.42 C 159.34,176.64 162.62,174.67 165.85,172.81 C 169.38,170.78 173.11,168.82 176.18,166.09 C 177.06,165.31 177.87,164.45 178.61,163.54 C 179.07,162.97 179.46,162.4 179.85,161.78 C 182.07,158.23 183.84,151.93 179.28,149.36 C 178.66,149.01 177.99,148.76 177.31,148.58 C 174.14,147.75 169.02,148 165.95,148 L 98.04,148 Z"/>
    <path id="median" d="M 102.57,86.5 L 33.45,86.51 C 32.53,86.51 31.21,86.52 30.26,86.55 C 27.12,86.66 22.17,87.03 21.41,90.91 C 21.33,91.32 21.31,91.75 21.35,92.17 C 21.41,92.83 21.6,93.48 21.89,94.08 C 22.22,94.78 22.67,95.43 23.19,96 C 24.13,97.04 25.22,97.91 26.43,98.62 C 30.79,101.18 35.83,101.46 40.76,101.48 L 176,101.48 C 178.57,101.45 181.49,101.51 183.88,100.37 C 188.49,98.17 188.77,90.98 184.7,88.09 C 182.38,86.44 178.54,86.55 175.88,86.52 L 102.57,86.5 Z"/>
