      <stop offset="0" stop-color="#a3dcba"/>
      <stop offset="0.5" stop-color="#3ece7a"/>
      <stop offset="1" stop-color="#1f7a45"/>
    </linearGradient>
    <linearGradient id="red" x1="100" y1="103" x2="100" y2="15.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2958c"/>
      <stop offset="0.5" stop-color="#f25e4f"/>
      <stop offset="1" stop-color="#9e372e"/>
    </linearGradient>
